{{- if .Values.llmGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "promptguard.fullname" . }}-llm-gateway
  labels:
    {{- include "promptguard.componentLabels" (dict "component" "llm-gateway" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: {{ .Values.llmGateway.service.type }}
  ports:
    - port: {{ .Values.llmGateway.service.port }}
      targetPort: 8002
      name: http
  selector:
    app.kubernetes.io/component: llm-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promptguard.fullname" . }}-llm-gateway
  labels:
    {{- include "promptguard.componentLabels" (dict "component" "llm-gateway" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ .Values.llmGateway.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: llm-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "promptguard.componentLabels" (dict "component" "llm-gateway" "Release" .Release "Chart" .Chart) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: llm-gateway
          image: {{ .Values.llmGateway.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8002
              name: http
          env:
            {{- range $key, $value := .Values.llmGateway.env }}
            - name: {{ $key }}
              value: {{ tpl $value $ | quote }}
            {{- end }}
            {{- range .Values.llmGateway.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.llmGateway.readinessPath }}
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.llmGateway.livenessPath }}
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.llmGateway.resources | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "promptguard.fullname" . }}-llm-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: llm-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.llmGateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "promptguard.fullname" . }}-llm-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "promptguard.fullname" . }}-llm-gateway
  minReplicas: {{ .Values.llmGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.llmGateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.llmGateway.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
