{{- if .Values.promptManager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "promptguard.fullname" . }}-prompt-manager
  labels:
    {{- include "promptguard.componentLabels" (dict "component" "prompt-manager" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: {{ .Values.promptManager.service.type }}
  ports:
    - port: {{ .Values.promptManager.service.port }}
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/component: prompt-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promptguard.fullname" . }}-prompt-manager
  labels:
    {{- include "promptguard.componentLabels" (dict "component" "prompt-manager" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ .Values.promptManager.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prompt-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "promptguard.componentLabels" (dict "component" "prompt-manager" "Release" .Release "Chart" .Chart) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: prompt-manager
          image: {{ .Values.promptManager.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- range $key, $value := .Values.promptManager.env }}
            - name: {{ $key }}
              value: {{ tpl $value $ | quote }}
            {{- end }}
            {{- range .Values.promptManager.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.promptManager.readinessPath }}
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.promptManager.livenessPath }}
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.promptManager.resources | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "promptguard.fullname" . }}-prompt-manager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prompt-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.promptManager.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "promptguard.fullname" . }}-prompt-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "promptguard.fullname" . }}-prompt-manager
  minReplicas: {{ .Values.promptManager.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.promptManager.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.promptManager.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
