{{- if .Values.validationEngine.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "promptguard.fullname" . }}-validation-api
  labels:
    {{- include "promptguard.componentLabels" (dict "component" "validation-api" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app.kubernetes.io/component: validation-api
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promptguard.fullname" . }}-validation-api
  labels:
    {{- include "promptguard.componentLabels" (dict "component" "validation-api" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ .Values.validationEngine.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: validation-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "promptguard.componentLabels" (dict "component" "validation-api" "Release" .Release "Chart" .Chart) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: validation-api
          image: {{ .Values.validationEngine.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8001
              name: http
          env:
            {{- range $key, $value := .Values.validationEngine.env }}
            - name: {{ $key }}
              value: {{ tpl $value $ | quote }}
            {{- end }}
            {{- range .Values.validationEngine.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.validationEngine.readinessPath }}
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.validationEngine.livenessPath }}
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.validationEngine.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promptguard.fullname" . }}-validation-worker
  labels:
    {{- include "promptguard.componentLabels" (dict "component" "validation-worker" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ .Values.validationEngine.workerReplicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: validation-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "promptguard.componentLabels" (dict "component" "validation-worker" "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      containers:
        - name: validation-worker
          image: {{ .Values.validationEngine.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          command: ["python", "-m", "app.worker"]
          env:
            {{- range $key, $value := .Values.validationEngine.env }}
            - name: {{ $key }}
              value: {{ tpl $value $ | quote }}
            {{- end }}
            {{- range .Values.validationEngine.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          resources:
            {{- toYaml .Values.validationEngine.resources | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "promptguard.fullname" . }}-validation-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: validation-api
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
