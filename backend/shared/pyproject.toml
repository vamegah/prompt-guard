[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard-shared"
version = "0.1.0"
description = "Shared library for PromptGuard"
authors = [{name = "PromptGuard Team", email = "team@promptguard.io"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "openai>=1.0",
    "anthropic>=0.18"
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["promptguard_shared*"]