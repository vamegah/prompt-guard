name: PromptGuard Validation
description: Run PromptGuard CLI validation and post results as a GitHub PR comment.
inputs:
  prompt-file:
    description: Path to the prompt template file.
    required: false
    default: prompt.txt
  schema-file:
    description: Path to the JSON schema file.
    required: false
    default: schema.json
  tests-file:
    description: Path to the test inputs file.
    required: false
    default: tests.json
  provider:
    description: LLM provider to use for validation.
    required: false
    default: openai
  model:
    description: Optional model name to pass to the CLI.
    required: false
    default: ""
  output-format:
    description: Output format for the validation report.
    required: false
    default: text
  github-token:
    description: GitHub token used to create or update the PR comment.
    required: true
  openai-api-key:
    description: OpenAI API Key
    required: false
    default: ""
  anthropic-api-key:
    description: Anthropic API Key
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PromptGuard CLI
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e backend/shared
        pip install -e backend/cli

    - name: Run PromptGuard validation
      id: validate
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        mkdir -p promptguard-output
        MODEL_ARGS=()
        if [ -n "${{ inputs.model }}" ]; then
          MODEL_ARGS=(--model "${{ inputs.model }}")
        fi
        promptguard validate "${{ inputs.prompt-file }}" "${{ inputs.schema-file }}" "${{ inputs.tests-file }}" --provider "${{ inputs.provider }}" --output-format "${{ inputs.output-format }}" "${MODEL_ARGS[@]}" 2>&1 | tee promptguard-output/validation.txt
        echo "validation_result<<EOF" >> $GITHUB_OUTPUT
        cat promptguard-output/validation.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}

    - name: Post results to PR comment
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ inputs.github-token }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ## PromptGuard Validation Results
          **Provider:** `${{ inputs.provider }}`
          **Prompt file:** `${{ inputs.prompt-file }}`
          **Schema file:** `${{ inputs.schema-file }}`
          **Tests file:** `${{ inputs.tests-file }}`

          <details>
          <summary>Validation output</summary>

          ```text
          ${{ steps.validate.outputs.validation_result }}
          ```
          </details>

    - name: Fail workflow when validation fails
      if: always() && steps.validate.outcome == 'failure'
      shell: bash
      run: exit 1
