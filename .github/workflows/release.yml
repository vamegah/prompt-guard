name: Release

on:
  push:
    tags:
      - 'v*'

env:
  # Use promptguard as the registry, matching the existing workflow
  DOCKER_REGISTRY: promptguard

jobs:
  build_and_push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: prompt-manager
            context: backend/
            dockerfile: backend/services/prompt-manager/Dockerfile
          - service: validation-engine
            context: backend/
            dockerfile: backend/services/validation-engine/Dockerfile
          - service: llm-gateway
            context: backend/
            dockerfile: backend/services/llm-gateway/Dockerfile
          - service: analytics
            context: backend/
            dockerfile: backend/services/analytics/Dockerfile
          - service: frontend
            context: frontend/
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.service }}:${{ steps.get_version.outputs.VERSION }}
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.service }}:latest

  publish_pypi:
    name: Publish CLI to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build CLI package
        run: |
          cd backend/cli
          pip install build
          python -m build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages_dir: backend/cli/dist/

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_and_push, publish_pypi]
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true